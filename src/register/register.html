<div class="main-container">

    <div class="form-wrapper caja">
        <h2>Regístrate</h2>
        <form action="#">
            <div class="input-group">
                <label for="reg-username">Usuario</label>
                <input type="text" id="reg-username" name="username" placeholder="Nombre de usuario" required>
            </div>

            <div class="input-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" name="email" placeholder="tu@email.com" required>
            </div>

            <div class="input-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" name="password" placeholder="Mínimo 8 caracteres" required>
            </div>

            <div class="input-group">
                <label for="reg-conf-password">Confirma la Contraseña</label>
                <input type="password" id="reg-conf-password" name="conf-password" placeholder="Mínimo 8 caracteres"
                    required>
            </div>

            <button type="submit" id="btn-registro" class="btn-registro">Crear cuenta</button>
        </form>
    </div>

</div>
